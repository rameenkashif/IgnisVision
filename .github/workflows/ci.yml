name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ignis
          POSTGRES_PASSWORD: ignis
          POSTGRES_DB: ignis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ignis" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://ignis:ignis@localhost:5432/ignis
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: black --check .
      - name: Migrations match models
        run: alembic upgrade head && alembic check
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Typed API client matches committed OpenAPI schema
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp .env.example .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/; s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-$(openssl rand -hex 8)/" .env
      - run: docker compose build
      - name: Smoke test the stack over HTTPS
        run: |
          docker compose up -d db backend frontend caddy
          for i in $(seq 1 60); do
            curl -skf https://localhost/api/v1/health/ready && break
            sleep 2
          done
          curl -skf https://localhost/api/v1/health/ready
          curl -skf https://localhost/ | grep -q '<div id="root">'
          docker compose exec -T -e SEED_PASSWORD=Ci-demo-1234 backend python -m app.db.seed
          curl -skf https://localhost/api/v1/auth/login -H 'content-type: application/json' \
            -d '{"username":"admin","password":"Ci-demo-1234"}' | grep -q access_token
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: End-to-end tests (Playwright)
        working-directory: frontend
        env:
          CI: "true"
          E2E_PASSWORD: Ci-demo-1234
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - if: always()
        run: docker compose logs --no-color | tail -200
      - if: always()
        run: docker compose down -v
