[project]
name = "ignis-vision-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends", "fastapi.Body", "fastapi.Path"]

[tool.ruff.lint.per-file-ignores]
# Bilingual narrative templates: long sentences read better unbroken.
"app/services/reports.py" = ["E501"]
"app/reports/labels.py" = ["E501"]
"app/reports/pdf.py" = ["E501"]
"app/db/demo.py" = ["E501"]
