# Dev overrides: hot reload + exposed ports.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up db backend
#   cd frontend && npm run dev     # https://<host>:5173, proxies /api and /ws to :8000
services:
  db:
    ports:
      - "5432:5432"

  backend:
    environment:
      ENVIRONMENT: dev
      CORS_ORIGINS: '["https://localhost","https://localhost:5173"]'
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/app:/app/app
    ports:
      - "8000:8000"
